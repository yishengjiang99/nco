name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wasm toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Native oscillator smoke test
        run: npm test

      - name: Compile C to wasm and wrap JS
        run: npm run build

      - name: Stage site
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          cp index.html mkdiv.js _site/
          cp -R web libs build _site/
          if [ -f README.md ]; then cp README.md _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
