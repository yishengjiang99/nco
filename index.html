<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wavetable Oscillators</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 12px;
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      #status {
        width: min(100%, 720px);
        min-height: 2.5em;
        font: 13px/1.4 ui-monospace, monospace;
        white-space: pre-wrap;
      }
      #panel {
        width: min(100%, 720px);
        display: grid;
        gap: 6px;
      }
      #panel label { display: flex; justify-content: space-between; gap: 8px; }
      #start {
        font-size: 20px;
        padding: 16px 28px;
        min-height: 48px;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        cursor: pointer;
      }
      #keyboard {
        width: min(100%, 999px);
        height: 150px;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <nav><code>nco</code> wavetable oscillator</nav>
    <button id="start" type="button">Start audio</button>
    <pre id="status">tap Start, then a piano key</pre>
    <div id="panel"></div>
    <div id="keyboard"></div>
    <script src="./libs/qwerty-hancock.js"></script>
    <script type="module" src="./web/main-thread.js"></script>
  </body>
</html>
